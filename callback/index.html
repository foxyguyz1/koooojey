<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxlink - Autenticando...</title>
    <style>
        body {
            background-color: #131722;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: linear-gradient(180deg, #131c31 0%, #0c1322 100%);
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 16px;
            padding: 35px 30px;
            text-align: center;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(59, 130, 246, 0.2);
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { font-size: 18px; margin: 0 0 8px 0; color: #fff; }
        p { font-size: 14px; color: #94a3b8; margin: 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader"></div>
        <h2 id="statusTitle">Autenticando com o Discord...</h2>
        <p id="statusDesc">Aguarde enquanto carregamos suas informações de perfil.</p>
    </div>

    <script>
        async function processAuth() {
            // Helper para salvar cookie
            function saveUserCookie(userData) {
                const d = new Date();
                d.setTime(d.getTime() + (30 * 24 * 60 * 60 * 1000));
                document.cookie = 'discord_user=' + encodeURIComponent(JSON.stringify(userData)) + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
                localStorage.setItem('discord_user', JSON.stringify(userData));
            }

            // 1. Verificar se recebeu token no Hash (#access_token=...)
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);
            const accessToken = hashParams.get('access_token');

            // 2. Verificar se recebeu parâmetros na Query (?username=... ou ?code=...)
            const queryParams = new URLSearchParams(window.location.search);
            const usernameParam = queryParams.get('username');

            if (usernameParam) {
                const userData = {
                    username: usernameParam,
                    id: queryParams.get('id') || '',
                    avatar: queryParams.get('avatar') || '',
                    avatar_url: queryParams.get('avatar_url') || ''
                };
                saveUserCookie(userData);
                window.location.href = '/';
                return;
            }

            if (accessToken) {
                try {
                    // Buscar dados diretamente da API do Discord
                    const res = await fetch('https://discord.com/api/users/@me', {
                        headers: {
                            Authorization: 'Bearer ' + accessToken
                        }
                    });
                    
                    if (res.ok) {
                        const user = await res.json();
                        const avatarUrl = user.avatar 
                            ? 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.png'
                            : 'https://cdn.discordapp.com/embed/avatars/0.png';

                        const userData = {
                            username: user.username,
                            id: user.id,
                            avatar: user.avatar,
                            avatar_url: avatarUrl
                        };

                        saveUserCookie(userData);
                        document.getElementById('statusTitle').innerText = 'Sucesso!';
                        document.getElementById('statusDesc').innerText = 'Redirecionando para a página inicial...';
                        
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 500);
                        return;
                    }
                } catch (e) {
                    console.error('Erro ao buscar dados do Discord:', e);
                }
            }

            // Fallback caso não tenha conseguido obter
            setTimeout(() => {
                window.location.href = '/';
            }, 1200);
        }

        processAuth();
    </script>
</body>
</html>
