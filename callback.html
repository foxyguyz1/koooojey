<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxlink - Verificando Conta...</title>
    <style>
        body {
            background-color: #131722;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: linear-gradient(180deg, #131c31 0%, #0c1322 100%);
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 16px;
            padding: 35px 30px;
            text-align: center;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(59, 130, 246, 0.2);
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { font-size: 18px; margin: 0 0 8px 0; color: #fff; }
        p { font-size: 14px; color: #94a3b8; margin: 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader"></div>
        <h2>Conectando ao Discord...</h2>
        <p>Aguarde um instante enquanto processamos sua autorização.</p>
    </div>

    <script>
        // Check URL parameters
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const username = params.get('username');
        const avatar = params.get('avatar');
        const id = params.get('id');

        if (username) {
            const userData = {
                username: username,
                id: id || '',
                avatar: avatar || '',
                avatar_url: params.get('avatar_url') || ''
            };
            const d = new Date();
            d.setTime(d.getTime() + (30 * 24 * 60 * 60 * 1000));
            document.cookie = 'discord_user=' + encodeURIComponent(JSON.stringify(userData)) + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
            localStorage.setItem('discord_user', JSON.stringify(userData));
            
            window.location.href = '/';
        } else {
            // Se tiver o code (retornado direto pelo Discord)
            // Redireciona para o index passando os parâmetros ou salva temporariamente
            setTimeout(() => {
                window.location.href = '/';
            }, 1500);
        }
    </script>
</body>
</html>
